# Builds the storefront as static files and publishes it to GitHub Pages.
# Runs on every push to main, every 6 hours (to pick up product, price and
# stock changes from Shopify) and on demand from the Actions tab.
#
# Settings → Pages → Source must be set to "GitHub Actions".
# Shopify settings come from Settings → Secrets and variables → Actions (see README).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build static site
        run: |
          # With a custom domain (SITE_URL variable set) the site lives at the domain root.
          if [ -n "$CUSTOM_SITE_URL" ]; then
            export NEXT_PUBLIC_SITE_URL="$CUSTOM_SITE_URL" NEXT_PUBLIC_BASE_PATH=""
          else
            export NEXT_PUBLIC_SITE_URL="$PAGES_BASE_URL" NEXT_PUBLIC_BASE_PATH="$PAGES_BASE_PATH"
          fi
          npm run build
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
          NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          NEXT_PUBLIC_SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ vars.INSTAGRAM_URL }}
          NEXT_PUBLIC_TIKTOK_URL: ${{ vars.TIKTOK_URL }}
          NEXT_PUBLIC_FACEBOOK_URL: ${{ vars.FACEBOOK_URL }}
          NEXT_PUBLIC_NEWSLETTER_WEBHOOK_URL: ${{ vars.NEWSLETTER_WEBHOOK_URL }}
          NEXT_PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.CONTACT_WEBHOOK_URL }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
